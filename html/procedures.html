<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedures Search - LexaGuide</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="../css/home.css" />

  <style>
    body {
      background-color: #0B1120;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      direction: rtl; /* For Arabic primarily */
    }

    .procedures-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      color: #C5954A;
      text-align: center;
      margin-bottom: 30px;
    }

    /* Search Bar */
    .search-bar-wrap {
      display: flex;
      align-items: center;
      background: #111827;
      border: 1px solid rgba(197, 149, 74, 0.4);
      border-radius: 8px;
      padding: 10px 15px;
      margin-bottom: 30px;
    }
    
    .search-bar-wrap i {
      color: #C5954A;
      font-size: 20px;
      margin-left: 15px; /* RTL Note: left margin pushes input */
    }

    .search-bar-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 16px;
      outline: none;
      font-family: 'Tajawal', sans-serif;
    }

    /* Layout */
    .layout-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 30px;
    }
    
    @media (max-width: 768px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Cards */
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: 600px;
      overflow-y: auto;
      padding-left: 5px; /* Scrollbar space */
    }

    .procedure-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(197, 149, 74, 0.2);
      border-radius: 8px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .procedure-card:hover, .procedure-card.active {
      border-color: #C5954A;
      background: rgba(197, 149, 74, 0.1);
    }
    
    .procedure-card h4 {
      color: #C5954A;
      margin-top: 0;
      margin-bottom: 5px;
    }
    
    .procedure-card .desc {
      font-size: 14px;
      color: #bbb;
      margin-bottom: 10px;
    }
    
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge.online { background: #10b981; color: #fff; }
    .badge.offline { background: #3b82f6; color: #fff; }
    .badge.both { background: #8b5cf6; color: #fff; }

    /* Details Panel */
    .procedure-details {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(197, 149, 74, 0.3);
      border-radius: 8px;
      padding: 25px;
      min-height: 400px;
    }

    .details-empty {
      text-align: center;
      color: #666;
      margin-top: 150px;
    }

    /* Type Selector for 'both' */
    .type-selector {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      background: #111827;
      padding: 5px;
      border-radius: 6px;
    }

    .type-btn {
      flex: 1;
      text-align: center;
      padding: 10px;
      background: transparent;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .type-btn.active {
      background: #C5954A;
      color: #111827;
    }

    .info-section {
      margin-bottom: 20px;
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 6px;
    }
    .info-section h3 {
      color: #C5954A;
      margin-top: 0;
      font-size: 16px;
      border-bottom: 1px dashed rgba(197, 149, 74, 0.4);
      padding-bottom: 10px;
    }
    .info-list {
      list-style-type: disc;
      padding-right: 20px;
      color: #ddd;
    }
    .info-list li { margin-bottom: 8px; }

    .btn-link {
      display: inline-block;
      background: #C5954A;
      color: #111827;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 10px;
      text-align: center;
    }
    .btn-link:hover { background: #a87e3d; }
    
    .spinner {
      text-align: center;
      color: #C5954A;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <nav class="navbar" style="padding: 1rem 2rem; background: #0B1120;">
    <a href="home.html" class="navbar-logo" style="color:#C5954A; text-decoration:none; font-size:1.5rem; font-weight:bold;">
      LexaGuide
    </a>
  </nav>

  <div class="procedures-container">
    <h1>دليل الإجراءات الحكومية</h1>

    <div class="search-bar-wrap">
      <i class="fas fa-search"></i>
      <input type="text" id="search-input" placeholder="ابحث عن إجراء... (مثال: شهادة ميلاد)" />
    </div>

    <div id="loading-spinner" class="spinner"><i class="fas fa-circle-notch fa-spin fa-2x"></i></div>

    <div class="layout-grid">
      <!-- Left (Results) -->
      <div class="results-list" id="results-list">
        <!-- Cards generated here -->
        <div style="color:#666; text-align:center; margin-top:20px;">ابحث لاستعراض النتائج المنطبقة هنا</div>
      </div>

      <!-- Right (Details) -->
      <div class="procedure-details" id="procedure-details">
        <div class="details-empty">
          <i class="fas fa-file-alt fa-3x" style="color: rgba(197, 149, 74, 0.5); margin-bottom: 15px;"></i>
          <p>اختر إجراء لعرض تفاصيله الكاملة</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/api.js"></script>
  <script src="../js/procedures.js"></script>
</body>
</html>
