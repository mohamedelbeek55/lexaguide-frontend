<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Document - LexaGuide</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Global Styles -->
  <link rel="stylesheet" href="../css/home.css" />

  <style>
    body {
      background-color: #0B1120;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
    }

    .doc-generator-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .doc-header {
      margin-bottom: 30px;
      text-align: center;
    }

    .doc-header h1 {
      color: #C5954A;
    }

    .controls-panel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(197, 149, 74, 0.3);
      padding: 20px;
      border-radius: 12px;
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .form-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-weight: bold;
      color: #C5954A;
    }

    .form-group select,
    .form-group input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(197, 149, 74, 0.5);
      background: #111827;
      color: #fff;
      width: 100%;
    }

    .btn-action {
      padding: 10px 20px;
      background: #C5954A;
      color: #111827;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action:hover {
      background: #b18542;
    }

    .workspace {
      display: flex;
      gap: 30px;
      height: 700px;
    }

    .work-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(197, 149, 74, 0.3);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .work-panel h3 {
      margin-top: 0;
      color: #C5954A;
      border-bottom: 1px solid rgba(197, 149, 74, 0.3);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    #dynamic-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* PDF Rendering Area (A4 aspect roughly) */
    .preview-container {
      background: #fff;
      color: #000;
      padding: 40px;
      border-radius: 8px;
      min-height: 800px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      font-family: Arial, sans-serif;
      line-height: 1.6;
      /* RTL support for arabic templates */
      direction: rtl;
    }

    .placeholder-highlight {
      background-color: #ffe066;
      border-bottom: 1px dashed #d4a55a;
      padding: 0 4px;
      border-radius: 2px;
      transition: background-color 0.3s;
    }
  </style>
</head>

<body>

  <!-- Minimal Nav -->
  <nav class="navbar" style="padding: 1rem 2rem; background: #0B1120;">
    <a href="home.html" class="navbar-logo"
      style="color:#C5954A; text-decoration:none; font-size:1.5rem; font-weight:bold;">
      LexaGuide
    </a>
  </nav>

  <div class="doc-generator-container">
    <div class="doc-header">
      <h1>Dynamic Document Generation</h1>
      <p>Select a template, fill the dynamic form, and generate your PDF instantly.</p>
    </div>

    <!-- Controls -->
    <div class="controls-panel">
      <div class="form-group">
        <label for="doc-type"><i class="fas fa-folder"></i> Document Type</label>
        <select id="doc-type">
          <option value="" disabled selected>-- Select Type --</option>
          <option value="contracts">Contracts</option>
          <option value="complaints">Complaints</option>
        </select>
      </div>

      <div class="form-group">
        <label for="template-select"><i class="fas fa-file-alt"></i> Template</label>
        <select id="template-select" disabled>
          <option value="">-- Waiting for type --</option>
        </select>
      </div>

      <button id="btn-download-pdf" class="btn-action" disabled>
        <i class="fas fa-file-pdf"></i> Download as PDF
      </button>
    </div>

    <!-- Workspace -->
    <div class="workspace">
      <!-- Left Panel: Form -->
      <div class="work-panel">
        <h3><i class="fas fa-pen"></i> Template Inputs</h3>
        <p id="form-instruction" style="color: #aaa;">Please select a template to generate the form.</p>
        <div id="dynamic-form"></div>
      </div>

      <!-- Right Panel: Live Preview -->
      <div class="work-panel">
        <h3><i class="fas fa-eye"></i> Live Preview</h3>
        <div class="preview-container" id="preview-content">
          <!-- Template text loads here -->
          <p style="color: #666; text-align: center; margin-top: 50%; direction: ltr;">
            Preview will appear here...
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="../shared/api.js"></script>
  <script src="../shared/navbar.js"></script>
  <script src="../js/generate-document.js"></script>
</body>

</html>
