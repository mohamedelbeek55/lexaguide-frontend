<!DOCTYPE html>
<html lang="en" id="htmlLang">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../shared/home.css">
    <link rel="stylesheet" href="../css/signup.css">
    <title>LexaGuide - Sign Up</title>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-logo" aria-label="LexaGuide home">
                <div class="navbar-logo-img">
                    <img src="../assets/logos/logo-removebg-preview.png" alt="LexaGuide logo">
                    <div class="navbar-logo-text">
                        <span class="navbar-brand">LexaGuide</span>
                        <span class="navbar-tagline">AI-Powered Legal Guidance</span>
                    </div>
                </div>
            </a>

            <button class="navbar-toggle" id="navbarToggle" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="navbar-menu" id="navbarMenu">
                <ul class="navbar-links">
                    <li><a href="../index.html" data-i18n="home">Home</a></li>
                    <li><a href="../index.html#services-section" data-i18n="services">Services</a></li>
                    <li><a href="./about.html" data-i18n="about">About</a></li>
                    <li><a href="../index.html#faq-section" data-i18n="faq">FAQ</a></li>
                </ul>

                <div class="navbar-right">
                    <div class="language-selector">
                        <button class="lang-btn" id="langBtn" onclick="toggleLangMenu()">
                            <svg class="lang-globe" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                                <path
                                    d="M2 12H22M12 2C14.5013 4.73835 15.9228 8.29203 16 12C15.9228 15.708 14.5013 19.2616 12 22C9.49872 19.2616 8.07725 15.708 8 12C8.07725 8.29203 9.49872 4.73835 12 2Z"
                                    stroke="currentColor" stroke-width="2" />
                            </svg>
                            <span class="lang-text" id="langText">English</span>
                            <svg class="lang-chevron" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div class="lang-dropdown" id="langDropdown">
                            <button class="lang-option" onclick="changeLanguage('en')">
                                <span>English</span>
                            </button>
                            <button class="lang-option" onclick="changeLanguage('ar')">
                                <span>العربية</span>
                            </button>
                        </div>
                    </div>
                    <div class="navbar-cta">
                        <a href="./login.html" class="btn-login" data-i18n="login">Login</a>
                        <a href="./signup.html" class="btn-signup active" data-i18n="signup">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sign Up Section -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-form-wrapper">
                <div class="form-container">
                    <div class="form-header">
                        <h2 data-i18n="signupTitle">Create Account</h2>
                    </div>

                    <form id="signupForm">
                        <div class="input-group">
                            <label for="fullname" data-i18n="fullNameLabel">Full Name</label>
                            <input type="text" id="fullname" name="fullname" autocomplete="name" required>
                        </div>
                        <div class="input-group">
                            <label for="nationalId" data-i18n="nationalIdLabel">National ID number</label>
                            <input type="text" id="nationalId" name="nationalId" placeholder="ex.123456789101214"
                                required>
                        </div>
                        <div class="input-group">
                            <label for="phone" data-i18n="phoneLabel">Phone Number</label>
                            <input type="text" id="phone" name="phone" placeholder="ex.01*********" autocomplete="tel"
                                required>
                        </div>

                        <div class="input-group">
                            <label for="email" data-i18n="emailLabel">E-mail Address</label>
                            <input type="email" id="email" name="email" placeholder="yourmail@gmail.com"
                                autocomplete="email" required>
                        </div>

                        <div class="input-group">
                            <label for="password" data-i18n="passwordLabel">Password</label>
                            <input type="password" id="password" name="password" placeholder="************"
                                autocomplete="new-password" required>
                            <!-- Password strength bar — 5-segment design -->
                            <div class="strength-bar-wrap" id="strengthBarWrap">
                                <span class="strength-seg"></span>
                                <span class="strength-seg"></span>
                                <span class="strength-seg"></span>
                                <span class="strength-seg"></span>
                                <span class="strength-seg"></span>
                            </div>
                            <p class="strength-label" id="strengthLabel"></p>
                        </div>

                        <div class="input-group">
                            <label for="confirm-password" data-i18n="confirmPasswordLabel">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirm-password"
                                placeholder="••••••••••" autocomplete="new-password" required>
                        </div>

                        <button type="submit" class="submit-btn" data-i18n="signupButton">CREATE ACCOUNT</button>

                        <div class="terms">
                            <span>By signing up, you agree to our <a href="#" data-i18n="termsLink">Terms of Service</a>
                                and <a href="#" data-i18n="privacyLink">Privacy Policy</a></span>
                        </div>
                    </form>

                    <div class="login-link-section">
                        <p data-i18n="alreadyHaveAccount">Already have an account?</p>
                        <a href="./login.html" class="login-btn" data-i18n="goToLogin">Go to Login</a>
                    </div>

                    <!-- ── Google Sign-Up ── -->
                    <div class="or-divider">
                        <span data-i18n="orContinueWith">or continue with</span>
                    </div>

                    <button type="button" id="googleBtn" class="google-btn" aria-label="Sign up with Google">
                        <span class="google-btn-inner">
                            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                    fill="#4285F4" />
                                <path
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                    fill="#34A853" />
                                <path
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                                    fill="#FBBC05" />
                                <path
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                                    fill="#EA4335" />
                            </svg>
                            <span class="google-btn-text" data-i18n="signUpWithGoogle">Sign up with Google</span>
                            <span class="google-btn-spinner" id="googleSpinner" style="display:none;">
                                <svg viewBox="0 0 24 24" fill="none">
                                    <circle cx="12" cy="12" r="10" stroke="rgba(255,255,255,0.3)" stroke-width="3" />
                                    <path d="M12 2a10 10 0 0 1 10 10" stroke="#c5954a" stroke-width="3"
                                        stroke-linecap="round" />
                                </svg>
                            </span>
                        </span>
                    </button>

                    <div id="googleErrorBanner" class="google-error-banner" style="display:none;"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/api.js"></script>
    <script src="../shared/navbar.js"></script>
    <script src="../js/signup.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>

</html>
